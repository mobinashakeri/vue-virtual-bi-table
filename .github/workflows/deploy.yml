name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel an in-flight Pages deploy — doing so jams the deployment queue.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Enables GitHub Pages automatically (source: GitHub Actions) on first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm install (not ci) so the deploy reconciles the lockfile instead of
      # hard-failing on a strict-mode version mismatch between npm releases.
      - run: npm install --no-audit --no-fund
      - run: npm run test:run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
